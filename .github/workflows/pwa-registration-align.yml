name: CaptaUP PWA Registration Alignment

on:
  push:
    branches: [main]
    paths:
      - 'captaup-pwa.js'
      - 'pwa-update.js'
      - 'sw.js'
      - '.github/workflows/pwa-registration-align.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align all service worker registration versions
        run: |
          python - <<'PY'
          import pathlib, re

          root = pathlib.Path('.')
          sw = (root / 'sw.js').read_text()
          match = re.search(r'CACHE\s*=\s*`\$\{CACHE_PREFIX\}(v[^`]+)`', sw)
          if not match:
              raise SystemExit('Unable to determine SW cache version')
          version = match.group(1)

          for filename in ('captaup-pwa.js', 'pwa-update.js'):
              path = root / filename
              text = path.read_text()
              updated = re.sub(r"sw\.js\?v(?:=)?[^'\"\s]+", f'sw.js?v={version}', text)
              if updated == text and f'sw.js?v={version}' not in text:
                  raise SystemExit(f'No service worker registration found in {filename}')
              path.write_text(updated)
          PY
      - name: Commit alignment when needed
        run: |
          if git diff --quiet -- captaup-pwa.js pwa-update.js; then
            echo 'Registrations already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captaup-pwa.js pwa-update.js
          git commit -m 'fix(pwa): auto-align CaptaUP service worker registrations'
          git push
